<!DOCTYPE html>
<html>
<head>
  <title>Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; }
    #reader {
      width: 95vw;
      max-width: 700px;
      margin: 16px auto;
      display: none; /* hidden until camera opened */
    }
    #result {
      margin-top: 16px;
      padding: 12px 18px;
      background-color: #28a745;
      color: #ffffff;
      font-weight: bold;
      border-radius: 6px;
      min-height: 28px;
      display: inline-block;
      font-size: 24px;
      max-width: 95vw;
      box-sizing: border-box;
    }
    #result:empty {
      display: none;
    }
    #controls {
      margin-top: 12px;
    }
    #openCameraBtn,
    #closeCameraBtn {
      padding: 10px 18px;
      margin: 4px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    #openCameraBtn {
      background-color: #007bff;
      color: #ffffff;
    }
    #closeCameraBtn {
      background-color: #6c757d;
      color: #ffffff;
      display: none; /* hidden until camera is open */
    }
  </style>
</head>
<body>

<h2>📦 Barcode Scanner</h2>
<div id="controls">
  <button id="openCameraBtn">Open Camera</button>
  <button id="closeCameraBtn">Close Camera</button>
</div>
<div id="reader"></div>
<p id="result"></p>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx3Uh1ebg5iwB7mqLsrXqmIzCMvosD4q178cjvmMoRTqe3OOfZK84xjOzBSEwHg99Tm/exec";

// Keep track of scanned barcodes
const scannedBarcodes = new Set();

// Html5Qrcode instance (created on demand)
let html5QrCode = null;
let isCameraRunning = false;

// Simple beep using Web Audio API so no external file is needed
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();

    osc.type = "sine";
    osc.frequency.value = 1000; // Hz

    osc.connect(gainNode);
    gainNode.connect(ctx.destination);

    gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch (e) {
    // If audio fails, just ignore
  }
}

function onScanSuccess(decodedText) {
  const resultEl = document.getElementById("result");

  if (scannedBarcodes.has(decodedText)) {
    resultEl.innerText = "Already scanned: " + decodedText;
    resultEl.style.backgroundColor = "#dc3545"; // red for duplicate
    playBeep();
    return;
  }

  scannedBarcodes.add(decodedText);

  resultEl.innerText = "Scanned: " + decodedText;
  resultEl.style.backgroundColor = "#28a745"; // green for new scan

  playBeep();

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      barcode: decodedText,
      device: navigator.userAgent
    })
  });
}

async function openCamera() {
  if (isCameraRunning) return;

  const readerEl = document.getElementById("reader");
  const openBtn = document.getElementById("openCameraBtn");
  const closeBtn = document.getElementById("closeCameraBtn");

  readerEl.style.display = "block";
  openBtn.style.display = "none";
  closeBtn.style.display = "inline-block";

  if (!html5QrCode) {
    html5QrCode = new Html5Qrcode("reader");
  }

  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 14, qrbox: 450 },
      onScanSuccess
    );
    isCameraRunning = true;
  } catch (err) {
    // If camera fails, reset UI
    readerEl.style.display = "none";
    openBtn.style.display = "inline-block";
    closeBtn.style.display = "none";
    isCameraRunning = false;
    alert("Unable to open camera: " + err);
  }
}

async function closeCamera() {
  if (!html5QrCode || !isCameraRunning) return;

  const readerEl = document.getElementById("reader");
  const openBtn = document.getElementById("openCameraBtn");
  const closeBtn = document.getElementById("closeCameraBtn");

  try {
    await html5QrCode.stop();
  } catch (err) {
    // ignore stop errors
  }

  isCameraRunning = false;
  readerEl.style.display = "none";
  closeBtn.style.display = "none";
  openBtn.style.display = "inline-block";
}

document.getElementById("openCameraBtn").addEventListener("click", openCamera);
document.getElementById("closeCameraBtn").addEventListener("click", closeCamera);
</script>

</body>
</html>
