<!DOCTYPE html>
<html>
<head>
  <title>Barcode Scanner</title>
  <meta name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; }
    #reader {
      width: 100%;
      max-width: 100%;
      margin: 16px auto;
    }
    #result {
      margin-top: 16px;
      padding: 12px 18px;
      background-color: #28a745;
      color: #ffffff;
      font-weight: bold;
      border-radius: 6px;
      min-height: 28px;
      display: inline-block;
      font-size: 18px;
      min-width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }
    .radio-group {
      margin: 20px auto;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border: 2px solid #007bff;
      border-radius: 8px;
      background-color: #f8f9fa;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 18px;
      font-weight: bold;
    }
    .radio-option:hover {
      background-color: #e9ecef;
      border-color: #0056b3;
    }
    .radio-option input[type="radio"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #007bff;
    }
    .radio-option input[type="radio"]:checked + label {
      color: #007bff;
    }
    .radio-option.selected {
      background-color: #007bff;
      color: #ffffff;
      border-color: #0056b3;
    }
    .radio-option.selected label {
      color: #ffffff;
    }
    .radio-option label {
      cursor: pointer;
      margin: 0;
      user-select: none;
    }
  </style>
</head>
<body>


    <div id="reader"></div>

<div class="radio-group">
  <div class="radio-option selected">
    <input type="radio" id="flipkart" name="sheetSelector" value="Flipkart" checked>
    <label for="flipkart">Flipkart</label>
  </div>
  <div class="radio-option">
    <input type="radio" id="meesho" name="sheetSelector" value="Meesho">
    <label for="meesho">Meesho</label>
  </div>
</div>
<p id="result"></p>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwmg98qCbqjv2DPjmCYlknG4X-788JERNQpYX66rMOX6PXxKN-sLsTwxiwXpCmFTY9F/exec";

// Keep track of scanned barcodes
const scannedBarcodes = new Set();

// Simple beep using Web Audio API so no external file is needed
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();

    osc.type = "sine";
    osc.frequency.value = 1000; // Hz

    osc.connect(gainNode);
    gainNode.connect(ctx.destination);

    gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch (e) {
    // If audio fails, just ignore
  }
}

function onScanSuccess(decodedText) {
  const resultEl = document.getElementById("result");
  const selectedRadio = document.querySelector('input[name="sheetSelector"]:checked');
  const selectedSheet = selectedRadio ? selectedRadio.value : "Flipkart";

  if (scannedBarcodes.has(decodedText)) {
    resultEl.innerText = "Already scanned: " + decodedText;
    resultEl.style.backgroundColor = "#dc3545"; // red for duplicate
    playBeep();
    return;
  }

  scannedBarcodes.add(decodedText);

  resultEl.innerText = "Scanned: " + decodedText + " → " + selectedSheet;
  resultEl.style.backgroundColor = "#28a745"; // green for new scan

  playBeep();

  // Send data to Google Apps Script
  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({
      barcode: decodedText,
      sheet: selectedSheet,
      device: navigator.userAgent,
      timestamp: new Date().toISOString()
    })
  }).catch(err => {
    console.log("Data sent to " + selectedSheet + " sheet");
  });
}

// Handle radio button selection visual feedback
document.querySelectorAll('input[name="sheetSelector"]').forEach(radio => {
  radio.addEventListener('change', function() {
    document.querySelectorAll('.radio-option').forEach(option => {
      option.classList.remove('selected');
    });
    this.closest('.radio-option').classList.add('selected');
  });
});

const html5QrCode = new Html5Qrcode("reader");
html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 350 },
  onScanSuccess
);
</script>

</body>
</html>
