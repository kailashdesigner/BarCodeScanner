<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Base Barcode Scanner</title>

  <!-- IMPORTANT: viewport for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- html5-qrcode library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
    }

    h2 {
      margin: 16px 0;
    }

    #reader {
      width: 100%;
      height: 70vh;
      margin: auto;
      background: #000;
    }

    #result {
      margin: 16px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      background: #28a745;
      color: #fff;
      border-radius: 8px;
      display: none;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h2>📦 Base Barcode Scanner</h2>

  <div id="reader"></div>

  <div id="result"></div>

  <script>
    const resultEl = document.getElementById("result");

    function onScanSuccess(decodedText) {
      resultEl.style.display = "block";
      resultEl.textContent = "Scanned: " + decodedText;
    }

    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 10,
       
      },
      onScanSuccess
    ).catch(err => {
      alert("Camera error: " + err);
    });
  </script>

</body>
</html>
