<!DOCTYPE html>
<html>
<head>
  <title>Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; }
    #reader {
      width: 90vw;
      max-width: 700px;
      margin: 16px auto;
    }
    #result {
      margin-top: 16px;
      padding: 10px 14px;
      background-color: #28a745;
      color: #ffffff;
      font-weight: bold;
      border-radius: 6px;
      min-height: 24px;
      display: inline-block;
    }
  </style>
</head>
<body>

<h2>📦 Barcode Scanner</h2>
<div id="reader"></div>
<p id="result"></p>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx3Uh1ebg5iwB7mqLsrXqmIzCMvosD4q178cjvmMoRTqe3OOfZK84xjOzBSEwHg99Tm/exec";

function onScanSuccess(decodedText) {
  document.getElementById("result").innerText = "Scanned: " + decodedText;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      barcode: decodedText,
      device: navigator.userAgent
    })
  });
}

const html5QrCode = new Html5Qrcode("reader");
html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 350 },
  onScanSuccess
);
</script>

</body>
</html>
