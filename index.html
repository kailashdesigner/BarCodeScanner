<!DOCTYPE html>
<html>
<head>
  <title>Barcode Scanner</title>
  <meta name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; }
    #reader {
      width: 100%;
      max-width: 100%;
      margin: 16px auto;
    }
    #result {
      margin-top: 16px;
      padding: 12px 18px;
      background-color: #28a745;
      color: #ffffff;
      font-weight: bold;
      border-radius: 6px;
      min-height: 28px;
      display: inline-block;
      font-size: 18px;
      min-width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }
    #sheetSelector {
      margin: 20px auto;
      padding: 12px 20px;
      font-size: 18px;
      border: 2px solid #007bff;
      border-radius: 8px;
      background-color: #f8f9fa;
      cursor: pointer;
      min-width: 200px;
      text-align: center;
    }
    #sheetSelector:focus {
      outline: none;
      border-color: #0056b3;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }
    .selector-label {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }
  </style>
</head>
<body>

<h2>📦 Barcode Scanner</h2>
<div class="selector-label">Select Platform:</div>
<select id="sheetSelector">
  <option value="Flipkart">Flipkart</option>
  <option value="Meesho">Meesho</option>
</select>
<div id="reader"></div>
<p id="result"></p>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwmg98qCbqjv2DPjmCYlknG4X-788JERNQpYX66rMOX6PXxKN-sLsTwxiwXpCmFTY9F/exec";

// Keep track of scanned barcodes
const scannedBarcodes = new Set();

// Simple beep using Web Audio API so no external file is needed
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();

    osc.type = "sine";
    osc.frequency.value = 1000; // Hz

    osc.connect(gainNode);
    gainNode.connect(ctx.destination);

    gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch (e) {
    // If audio fails, just ignore
  }
}

function onScanSuccess(decodedText) {
  const resultEl = document.getElementById("result");
  const sheetSelector = document.getElementById("sheetSelector");
  const selectedSheet = sheetSelector.value;

  if (scannedBarcodes.has(decodedText)) {
    resultEl.innerText = "Already scanned: " + decodedText;
    resultEl.style.backgroundColor = "#dc3545"; // red for duplicate
    playBeep();
    return;
  }

  scannedBarcodes.add(decodedText);

  resultEl.innerText = "Scanned: " + decodedText + " → " + selectedSheet;
  resultEl.style.backgroundColor = "#28a745"; // green for new scan

  playBeep();

  // Send data to Google Apps Script
  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({
      barcode: decodedText,
      sheet: selectedSheet,
      device: navigator.userAgent,
      timestamp: new Date().toISOString()
    })
  }).catch(err => {
    console.log("Data sent to " + selectedSheet + " sheet");
  });
}

const html5QrCode = new Html5Qrcode("reader");
html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 450 },
  onScanSuccess
);
</script>

</body>
</html>
