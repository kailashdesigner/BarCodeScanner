<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Horizontal Barcode Scanner</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
    }

    h2 {
      margin: 16px 0;
    }

    #reader {
      width: 100%;
      height: 70vh;
      background: #000;
    }

    #hint {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    #result {
      margin: 16px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      background: #28a745;
      color: #fff;
      border-radius: 8px;
      display: none;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h2>📦 Horizontal Bar code Scanner</h2>
  <div id="hint">Scan the long horizontal barcode only</div>

  <div id="reader"></div>

  <div id="result"></div>

  <script>
    const scannedSet = new Set();

    const API_URL = "https://script.google.com/macros/s/AKfycbzkh97lv75JjFuqEalsJ4zonNok9jLPl08hopcTwJVZPoS4bYHnoORki3gT7X_7A5q1/exec";

    const resultEl = document.getElementById("result");

    function onScanSuccess(decodedText, decodedResult) {
  // Ignore 2D formats (from Step 2)
  const format =
    decodedResult?.result?.format?.formatName || "";

  const blockedFormats = ["QR_CODE", "DATA_MATRIX", "PDF_417"];
  if (blockedFormats.includes(format)) {
    return;
  }

  // DUPLICATE CHECK (Step 4)
  if (scannedSet.has(decodedText)) {
    resultEl.style.display = "block";
    resultEl.style.background = "#dc3545"; // red
    resultEl.textContent = "Already scanned: " + decodedText;
    return;
  }

  scannedSet.add(decodedText);

  // Normal success
  resultEl.style.display = "block";
  resultEl.style.background = "#28a745"; // green
  resultEl.textContent = "Scanned: " + decodedText;

  // Save to Google Sheet
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      trackingId: decodedText
    })
  });
}


    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 12,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.ITF
        ],
        qrbox: function (w, h) {
          return {
            width: w * 0.9,    // wide
            height: h * 0.25   // short (horizontal)
          };
        }
      },
      onScanSuccess
    ).catch(err => {
      alert("Camera error: " + err);
    });
  </script>

</body>
</html>
