<!DOCTYPE html>
<html>
<head>
  <title>Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; }
    #reader {
      width: 90vw;
      max-width: 700px;
      margin: 16px auto;
    }
    #result {
      margin-top: 16px;
      padding: 12px 18px;
      background-color: #28a745;
      color: #ffffff;
      font-weight: bold;
      border-radius: 6px;
      min-height: 28px;
      display: inline-block;
      font-size: 18px;
      min-width: 70vw;
      max-width: 90vw;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<h2>📦 Barcode Scanner</h2>
<div id="reader"></div>
<p id="result"></p>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx3Uh1ebg5iwB7mqLsrXqmIzCMvosD4q178cjvmMoRTqe3OOfZK84xjOzBSEwHg99Tm/exec";

// Keep track of scanned barcodes
const scannedBarcodes = new Set();

// Simple beep using Web Audio API so no external file is needed
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();

    osc.type = "sine";
    osc.frequency.value = 1000; // Hz

    osc.connect(gainNode);
    gainNode.connect(ctx.destination);

    gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch (e) {
    // If audio fails, just ignore
  }
}

function onScanSuccess(decodedText) {
  const resultEl = document.getElementById("result");

  if (scannedBarcodes.has(decodedText)) {
    resultEl.innerText = "Already scanned: " + decodedText;
    resultEl.style.backgroundColor = "#dc3545"; // red for duplicate
    playBeep();
    return;
  }

  scannedBarcodes.add(decodedText);

  resultEl.innerText = "Scanned: " + decodedText;
  resultEl.style.backgroundColor = "#28a745"; // green for new scan

  playBeep();

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      barcode: decodedText,
      device: navigator.userAgent
    })
  });
}

const html5QrCode = new Html5Qrcode("reader");
html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 350 },
  onScanSuccess
);
</script>

</body>
</html>
