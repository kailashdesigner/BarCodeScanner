<!DOCTYPE html>
<html>
<head>
  <title>Barcode Scanner</title>
  <meta name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 10px;
    }

    #reader {
      width: 100%;
      max-width: 90%;
      margin: 16px auto;
      display: none; /* hidden until camera opened */
      position: relative; /* For overlay positioning */
    }

    /* Scan box masking overlay - darkens top/bottom, leaves center clear */
    #scanMask {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none; /* Allow camera interaction through overlay */
      z-index: 1;
      display: none; /* Hidden until camera opens */
    }

    #scanMask::before,
    #scanMask::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.6); /* Semi-transparent dark */
    }

    /* Top mask */
    #scanMask::before {
      top: 0;
      height: 30%; /* Adjust to control center strip height */
    }

    /* Bottom mask */
    #scanMask::after {
      bottom: 0;
      height: 30%; /* Adjust to control center strip height */
    }

    #result {
      margin-top: 16px;
      padding: 12px 18px;
      background-color: #28a745;
      color: #ffffff;
      font-weight: bold;
      border-radius: 6px;
      min-height: 28px;
      display: inline-block;
      font-size: 24px;
      max-width: 95vw;
      box-sizing: border-box;
    }

    #result:empty {
      display: none;
    }

    #controls {
      margin-top: 12px;
    }

    #openCameraBtn,
    #closeCameraBtn {
      padding: 10px 18px;
      margin: 4px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    #openCameraBtn {
      background-color: #007bff;
      color: #ffffff;
    }

    #closeCameraBtn {
      background-color: #6c757d;
      color: #ffffff;
      display: none; /* hidden until camera is open */
    }

    #flashlightBtn {
      padding: 10px 18px;
      margin: 4px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background-color: #ffc107;
      color: #000000;
      display: none; /* hidden until camera is open */
    }

    #flashlightBtn:active {
      background-color: #ff9800;
    }

    /* Mobile-first sheet selector */
    #sheetSelector {
      margin-top: 10px;
      font-size: 16px;
    }

    #sheetSelector label {
      margin: 0 8px;
      display: inline-block;
    }

    #sheetSelector input[type="radio"] {
      transform: scale(1.2);
      margin-right: 4px;
    }
  </style>
</head>
<body>

<h2>📦 Barcode Scanner New</h2>

<div id="controls">
  <button id="openCameraBtn">Open Camera</button>
  <button id="closeCameraBtn">Close Camera</button>
  <button id="flashlightBtn">🔦 Flash On</button>
</div>

<!-- NEW: simple target-sheet selector -->
<div id="sheetSelector">
  <span>Save to:</span>
  <label>
    <input type="radio" name="sheetTarget" value="Flipkart" checked>
    Flipkart
  </label>
  <label>
    <input type="radio" name="sheetTarget" value="Meesho">
    Meesho
  </label>
</div>

<div id="reader">
  <!-- Visual masking overlay for center horizontal scan strip -->
  <div id="scanMask"></div>
</div>
<p id="result"></p>

<script>
  // Set this to your deployed Apps Script web app URL later
  const API_URL = "https://script.google.com/macros/s/AKfycbwmg98qCbqjv2DPjmCYlknG4X-788JERNQpYX66rMOX6PXxKN-sLsTwxiwXpCmFTY9F/exec";

  // Keep track of scanned barcodes
  const scannedBarcodes = new Set();

  // Html5Qrcode instance (created on demand)
  let html5QrCode = null;
  let isCameraRunning = false;
  let activeVideoTrack = null; // Track for torch control
  let isTorchOn = false; // Track torch state

  // Simple beep using Web Audio API so no external file is needed
  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();

      osc.type = "sine";
      osc.frequency.value = 1000; // Hz

      osc.connect(gainNode);
      gainNode.connect(ctx.destination);

      gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch (e) {
      // If audio fails, just ignore
    }
  }

  // Helper: get currently selected sheet name (Flipkart / Meesho)
  function getSelectedSheet() {
    const selected = document.querySelector('input[name="sheetTarget"]:checked');
    // Default to Flipkart if nothing is selected for any reason
    return selected ? selected.value : "Flipkart";
  }

  /**
   * Check if scanned result is a 1D barcode format
   * @param {string} decodedText - The decoded text
   * @param {Object} decodedResult - The full decoded result object from html5-qrcode (optional)
   * @returns {boolean} True if 1D format, false if 2D format
   */
  function is1DBarcode(decodedText, decodedResult) {
    // List of 2D formats to reject
    const twoDFormats = [
      'QR_CODE',
      'DATAMATRIX',
      'PDF_417',
      'AZTEC',
      'MAXICODE'
    ];

    // List of allowed 1D formats
    const oneDFormats = [
      'CODE_128',
      'CODE_39',
      'EAN_13',
      'EAN_8',
      'UPC_A',
      'UPC_E',
      'ITF',
      'CODABAR',
      'RSS_14',
      'RSS_EXPANDED'
    ];

    // Try to get format from decodedResult object (html5-qrcode v2+)
    if (decodedResult) {
      // Check result.result.format or result.format (library version dependent)
      const format = decodedResult.result?.format || decodedResult.format;
      if (format) {
        const formatUpper = format.toUpperCase();
        // Reject if it's a 2D format
        if (twoDFormats.some(f => formatUpper.includes(f))) {
          return false;
        }
        // Accept if it's a known 1D format
        if (oneDFormats.some(f => formatUpper.includes(f))) {
          return true;
        }
      }
    }

    // Fallback: Use heuristics if format metadata not available
    // 1D barcodes are typically shorter and contain only digits/alphanumeric
    // QR codes often contain URLs, JSON, or longer structured data
    const textLength = decodedText.length;
    
    // Very long strings (>100 chars) are likely 2D codes (QR metadata)
    if (textLength > 100) {
      return false;
    }

    // Check for common QR code patterns
    if (decodedText.startsWith('http://') || 
        decodedText.startsWith('https://') ||
        decodedText.startsWith('data:') ||
        decodedText.includes('{') && decodedText.includes('}') ||
        decodedText.includes('[') && decodedText.includes(']')) {
      return false;
    }

    // Default: assume 1D if format cannot be determined
    // This is safer than rejecting unknown formats
    return true;
  }

  /**
   * Enhanced scan success handler with 1D format filtering
   * @param {string} decodedText - The decoded barcode text
   * @param {Object} decodedResult - Full result object from html5-qrcode (optional)
   */
  function onScanSuccess(decodedText, decodedResult) {
    // Filter out 2D codes (QR, DataMatrix, PDF417) - ignore silently
    if (!is1DBarcode(decodedText, decodedResult)) {
      // Silently ignore 2D codes - no beep, no vibration, no UI feedback
      return;
    }

    const resultEl = document.getElementById("result");

    // duplicate detection (unchanged)
    if (scannedBarcodes.has(decodedText)) {
      resultEl.innerText = "Already scanned: " + decodedText;
      resultEl.style.backgroundColor = "#dc3545"; // red for duplicate
      playBeep();
      vibrate(300); // longer vibration
      return;
    }

    scannedBarcodes.add(decodedText);

    resultEl.innerText = "Scanned: " + decodedText;
    resultEl.style.backgroundColor = "#28a745"; // green for new scan

    playBeep();
    vibrate(120); // short vibration
    // Minimal payload: barcode + selected sheet name only
    const payload = {
      barcode: decodedText,
      sheet: getSelectedSheet()
    };

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
      // No headers needed; Apps Script can parse raw JSON body
    }).catch(function (err) {
      // Fail silently on network issues to keep UX simple on mobile
      console.error("Failed to send to Apps Script:", err);
    });
  }

  async function openCamera() {
    if (isCameraRunning) return;

    const readerEl = document.getElementById("reader");
    const openBtn = document.getElementById("openCameraBtn");
    const closeBtn = document.getElementById("closeCameraBtn");

    readerEl.style.display = "block";
    openBtn.style.display = "none";
    closeBtn.style.display = "inline-block";

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    try {
      // Configure horizontal scan box - wider than tall to focus on 1D barcodes
      const qrboxFunction = function (viewfinderWidth, viewfinderHeight) {
        // Create a horizontal strip: 80% width, 25% height (centered)
        const width = viewfinderWidth * 0.8;
        const height = viewfinderHeight * 0.25;
        return { width: width, height: height };
      };

      const config = {
        fps: 14,
        qrbox: qrboxFunction
      };

      // Note: Format filtering is handled by is1DBarcode() function in onScanSuccess
      // This allows the library to scan all formats, then we filter in JavaScript

      await html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      );
      isCameraRunning = true;

      // Show scan mask overlay
      document.getElementById("scanMask").style.display = "block";

      // Get video track and check torch support after camera starts
      // Small delay to ensure track is available
      setTimeout(() => {
        activeVideoTrack = getVideoTrack();
        const flashlightBtn = document.getElementById("flashlightBtn");
        if (activeVideoTrack) {
          const capabilities = activeVideoTrack.getCapabilities();
          if (capabilities && capabilities.torch) {
            flashlightBtn.style.display = "inline-block";
          } else {
            flashlightBtn.style.display = "none";
          }
        } else {
          flashlightBtn.style.display = "none";
        }
      }, 500);
    } catch (err) {
      // If camera fails, reset UI
      readerEl.style.display = "none";
      openBtn.style.display = "inline-block";
      closeBtn.style.display = "none";
      document.getElementById("scanMask").style.display = "none"; // Hide overlay
      isCameraRunning = false;
      console.error("Camera error:", err);
      alert("Unable to open camera: " + (err.message || err));
    }
  }

  async function closeCamera() {
    if (!html5QrCode || !isCameraRunning) return;

    const readerEl = document.getElementById("reader");
    const openBtn = document.getElementById("openCameraBtn");
    const closeBtn = document.getElementById("closeCameraBtn");
    const flashlightBtn = document.getElementById("flashlightBtn");

    // Turn off torch before closing camera
    await turnOffTorch();

    try {
      await html5QrCode.stop();
    } catch (err) {
      // ignore stop errors
    }

    isCameraRunning = false;
    activeVideoTrack = null;
    readerEl.style.display = "none";
    closeBtn.style.display = "none";
    flashlightBtn.style.display = "none";
    document.getElementById("scanMask").style.display = "none"; // Hide overlay
    openBtn.style.display = "inline-block";
  }

  document.getElementById("openCameraBtn").addEventListener("click", openCamera);
  document.getElementById("closeCameraBtn").addEventListener("click", closeCamera);
  document.getElementById("flashlightBtn").addEventListener("click", toggleFlashlight);

  /**
   * Vibration helper - gracefully handles unsupported devices
   * @param {number} ms - Vibration duration in milliseconds
   */
  function vibrate(ms = 100) {
    try {
      if ("vibrate" in navigator) {
        navigator.vibrate(ms);
      }
    } catch (e) {
      // Silently fail if vibration is unavailable
    }
  }

  /**
   * Get the active video track from the camera stream
   * @returns {MediaStreamTrack|null} The video track or null if not available
   */
  function getVideoTrack() {
    try {
      // html5-qrcode uses getRunningTrack() to access the stream
      if (html5QrCode && typeof html5QrCode.getRunningTrack === 'function') {
        const track = html5QrCode.getRunningTrack();
        if (track && track.kind === 'video') {
          return track;
        }
      }
      // Fallback: try to get from the reader element's video
      const readerEl = document.getElementById("reader");
      const video = readerEl.querySelector("video");
      if (video && video.srcObject) {
        const stream = video.srcObject;
        const tracks = stream.getVideoTracks();
        if (tracks.length > 0) {
          return tracks[0];
        }
      }
    } catch (e) {
      // Silently fail if track cannot be accessed
    }
    return null;
  }

  /**
   * Toggle camera torch/flashlight
   * Only works on devices that support torch and when rear camera is active
   */
  async function toggleFlashlight() {
    if (!isCameraRunning) {
      return;
    }

    const track = getVideoTrack();
    if (!track) {
      return;
    }

    // Check if torch is supported
    const capabilities = track.getCapabilities();
    if (!capabilities || !capabilities.torch) {
      // Device doesn't support torch - hide button
      document.getElementById("flashlightBtn").style.display = "none";
      return;
    }

    try {
      const newState = !isTorchOn;
      await track.applyConstraints({
        advanced: [{ torch: newState }]
      });
      isTorchOn = newState;
      updateFlashlightButton();
    } catch (err) {
      // Torch may not be available or failed to toggle
      // Hide button if torch is not supported
      if (err.name === 'NotSupportedError' || err.name === 'NotReadableError') {
        document.getElementById("flashlightBtn").style.display = "none";
      }
    }
  }

  /**
   * Update flashlight button text and state
   */
  function updateFlashlightButton() {
    const btn = document.getElementById("flashlightBtn");
    if (btn) {
      btn.innerText = isTorchOn ? "💡 Flash Off" : "🔦 Flash On";
    }
  }

  /**
   * Turn off torch if it's on (called when camera closes)
   */
  async function turnOffTorch() {
    if (!isTorchOn || !activeVideoTrack) {
      return;
    }

    try {
      await activeVideoTrack.applyConstraints({
        advanced: [{ torch: false }]
      });
      isTorchOn = false;
      activeVideoTrack = null;
    } catch (e) {
      // Ignore errors when turning off
    }
  }

</script>

</body>
</html>
